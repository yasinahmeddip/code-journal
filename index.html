<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lions Electro Hub | Premium Electronics</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-mode">
    <nav class="navbar">
        <div class="container">
            <div class="logo-brand">
                <img src="logo.svg" alt="Lions Electro Hub" class="logo-img">
                <span class="logo-text">LIONS HUB</span>
            </div>
            <div class="search-bar">
                <input type="text" id="productSearch" placeholder="Search gadgets, MacBooks...">
                <button><i class="fas fa-search"></i></button>
            </div>
            <div class="nav-actions">
                <button id="cartBtn" class="nav-icon-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cartCount">0</span>
                </button>
                <button id="userBtn" class="nav-icon-btn">
                    <i class="fas fa-user"></i>
                </button>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Next-Gen Electronics</h1>
            <p>Experience the peak of performance with our MacBook line and premium gadgets.</p>
            <button class="btn-primary" onclick="scrollToShop()">Shop Now</button>
        </div>
    </header>

    <main class="container">
        <section class="filters">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="MacBooks">MacBooks</button>
            <button class="filter-btn" data-category="Gadgets">Gadgets</button>
            <button class="filter-btn" data-category="Lights">Lights</button>
        </section>

        <div id="productGrid" class="product-grid"></div>
    </main>

    <div id="cartSidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Your Cart</h2>
            <button id="closeCart">&times;</button>
        </div>
        <div id="cartItems"></div>
        <div class="sidebar-footer">
            <div class="total-box">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="btn-checkout">Proceed to Checkout</button>
        </div>
    </div>

    <div id="welcomePopup" class="modal">
        <div class="modal-content">
            <span class="close-popup">&times;</span>
            <h2>Welcome to Lions Hub!</h2>
            <p>Get 20% OFF your first order with code:</p>
            <div class="promo-code">LION20</div>
            <button class="btn-primary close-popup-btn">Start Shopping</button>
        </div>
    </div>

    <div id="overlay"></div>

    <footer>
        <p>&copy; 2023 Lions Electro Hub. Performance Electrified.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
