<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lions Electro Hub | Premium Tech Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <header>
        <nav class="container">
            <div class="logo-area">
                <img src="graphic.svg" alt="Lions Electro Hub" class="logo">
                <h1>Lions Electro</h1>
            </div>
            <div class="search-bar">
                <input type="text" id="productSearch" placeholder="Search gadgets...">
            </div>
            <div class="nav-actions">
                <button id="authBtn" onclick="openAuth()">Login</button>
                <div class="cart-icon" onclick="toggleCart()">
                    <span>🛒</span>
                    <span id="cartCount">0</span>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h2>Power Your Future</h2>
                <p>Exclusive deals on MacBooks, RGB Lights, and Premium Gadgets.</p>
                <button class="cta-btn" onclick="scrollToProducts()">Shop Now</button>
            </div>
        </section>

        <section class="filters container">
            <button class="filter-btn active" onclick="filterProducts('all')">All</button>
            <button class="filter-btn" onclick="filterProducts('laptops')">Laptops</button>
            <button class="filter-btn" onclick="filterProducts('gadgets')">Gadgets</button>
            <button class="filter-btn" onclick="filterProducts('lighting')">Lighting</button>
        </section>

        <section id="productGrid" class="product-grid container">
            <!-- Products injected by JS -->
        </section>
    </main>

    <div id="cartDrawer" class="drawer">
        <div class="drawer-content">
            <span class="close" onclick="toggleCart()">&times;</span>
            <h3>Your Cart</h3>
            <div id="cartItems"></div>
            <div class="cart-total">Total: $<span id="totalPrice">0</span></div>
            <button class="checkout-btn" onclick="proceedToCheckout()">Checkout</button>
        </div>
    </div>

    <div id="welcomePopup" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closePopup()">&times;</span>
            <h2>🦁 Welcome to the Pride!</h2>
            <p>Get 20% OFF your first order with code: <strong>LION20</strong></p>
            <button class="cta-btn" onclick="closePopup()">Claim Discount</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
