<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lions Electro Hub | Dark Premium Electronics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">
    <nav class="navbar">
        <div class="container flex-between">
            <div class="logo-area flex-center">
                <img src="graphic.svg" alt="Lions Electro Hub" class="logo">
                <span class="brand-name">LIONS<span class="text-accent">ELECTRO</span></span>
            </div>
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="Search gadgets...">
                <button id="searchBtn">Search</button>
            </div>
            <div class="nav-actions">
                <button id="cartToggle" class="btn-icon">🛒 <span id="cartCount">0</span></button>
                <button id="loginBtn" class="btn-primary">Login</button>
            </div>
        </div>
    </nav>

    <header class="hero-banner">
        <div class="container">
            <div class="hero-content">
                <h1 class="fade-in">The Future of <span class="text-accent">Power.</span></h1>
                <p>Exclusive deals on MacBooks, Smart Lighting, and Elite Gadgets.</p>
                <button class="btn-accent" onclick="scrollToProducts()">Shop Now</button>
            </div>
        </div>
    </header>

    <section class="filters container">
        <button class="filter-btn active" data-cat="all">All Products</button>
        <button class="filter-btn" data-cat="macbook">MacBooks</button>
        <button class="filter-btn" data-cat="gadgets">Gadgets</button>
        <button class="filter-btn" data-cat="lights">Lighting</button>
    </section>

    <main class="container">
        <div id="productGrid" class="grid-layout"></div>
    </main>

    <div id="cartSidebar" class="sidebar hidden">
        <div class="sidebar-header">
            <h2>Your Cart</h2>
            <button id="closeCart">×</button>
        </div>
        <div id="cartItems"></div>
        <div class="cart-footer">
            <h3>Total: <span id="cartTotal">$0.00</span></h3>
            <button class="btn-accent w-100" onclick="alert('Login required to checkout!')">Checkout</button>
        </div>
    </div>

    <div id="welcomePopup" class="modal hidden flex-center">
        <div class="modal-content">
            <h2>⚡ Welcome to Lions Electro Hub</h2>
            <p>Get an extra <strong>20% OFF</strong> on your first order. Use code: <strong>LION20</strong></p>
            <button id="closePopup" class="btn-accent">Claim Discount</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 Lions Electro Hub. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
